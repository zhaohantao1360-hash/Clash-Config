# =========================================================
# ZHT Mihomo Service Groups
# Clash Verge Rev / Mihomo Override
# =========================================================
# 用途：独立增加高频服务代理组，避免修改主配置后丢失。
# 使用方式：作为 Clash Verge Rev 的 Override/覆写配置使用。
# =========================================================

proxy-groups:
  - name: ✨ Gemini
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Gemini.png
    proxies:
      - 🇺🇲 美国节点
      - 🇯🇵 日本节点
      - 🇸🇬 狮城节点
      - 🌐 Google
      - ⚡ ISP优选
      - ♻️ 自动选择
      - 🚀 手动切换
      - DIRECT

  - name: 🤖 Claude
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Claude.png
    proxies:
      - 🇺🇲 美国节点
      - 🇯🇵 日本节点
      - 🇸🇬 狮城节点
      - ⚡ ISP优选
      - ♻️ 自动选择
      - 🚀 手动切换
      - DIRECT

  - name: 💻 GitHub
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/GitHub.png
    proxies:
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 狮城节点
      - 🇺🇲 美国节点
      - ⚡ ISP优选
      - 🚀 手动切换
      - DIRECT

  - name: 🎵 Spotify
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Spotify.png
    proxies:
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - ⚡ ISP优选
      - 🚀 手动切换
      - DIRECT

  - name: 🎵 TikTok
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TikTok.png
    proxies:
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🇨🇳 台湾节点
      - 🇭🇰 香港节点
      - ⚡ ISP优选
      - ♻️ 自动选择
      - 🚀 手动切换
      - DIRECT

rule-providers:
  Gemini:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/gemini.list
    path: ./ruleset/ZHT-Gemini.list
    interval: 86400

  Claude:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list
    path: ./ruleset/ZHT-Claude.list
    interval: 86400

  GitHub:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list
    path: ./ruleset/ZHT-GitHub.list
    interval: 86400

  Spotify:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify.list
    path: ./ruleset/ZHT-Spotify.list
    interval: 86400

  TikTok:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.list
    path: ./ruleset/ZHT-TikTok.list
    interval: 86400

rules:
  - RULE-SET,Gemini,✨ Gemini
  - RULE-SET,Claude,🤖 Claude
  - RULE-SET,GitHub,💻 GitHub
  - RULE-SET,Spotify,🎵 Spotify
  - RULE-SET,TikTok,🎵 TikTok
