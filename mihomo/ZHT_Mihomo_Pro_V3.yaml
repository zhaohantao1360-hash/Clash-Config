  # ---------------- Service Groups ----------------
  - name: 💬 OpenAI
    type: select
    proxies:
      - 🇺🇲 美国节点
      - 🇯🇵 日本节点
      - 🇸🇬 狮城节点
      - ⚡ ISP优选
      - ♻️ 自动选择
      - 🚀 手动切换
