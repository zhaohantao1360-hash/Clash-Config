  - name: 🇲🇾 马来西亚ISP
    type: url-test
    include-all: true
    filter: '(?i)(马来西亚\s*ISP|Malaysia.*ISP)'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 60
    timeout: 5000
