# =========================================================
# ZHT Mihomo Pro V3 / Clash Verge Rev
# 节点命名与 ISP 优化版
# =========================================================
# 根据实际订阅节点命名优化：
# 香港1-4 / 香港 ISP / 台湾1-4 / 新加坡1-4 / 日本1-4
# 美国1-4 / 韩国 ISP / 加拿大 ISP / 澳洲 ISP / 马来西亚 ISP
# 同时排除：到期时间、剩余流量、官网、邀请码、订阅提示等信息项
# =========================================================

mode: rule
mixed-port: 7897
allow-lan: false
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict

# ---------------- DNS ----------------
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - localhost
    - '*.localhost'
    - 'time.*.com'
    - 'time.*.gov'
    - 'ntp.*.com'
    - '+.push.apple.com'
    - '+.steamcontent.com'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    'geosite:private': system
    'geosite:cn':
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    '+.lan': system

# ---------------- GEO ----------------
geodata-mode: true
geox-url:
  geoip: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geo/geoip.dat
  geosite: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geo/geosite.dat
  mmdb: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country-lite.mmdb

# ---------------- Proxy Groups ----------------
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - ⚡ ISP优选
      - 🇭🇰 香港节点
      - 🇨🇳 台湾节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🇰🇷 韩国节点
      - 🌍 其他地区
      - 🚀 手动切换
      - DIRECT

  - name: 🚀 手动切换
    type: select
    include-all: true

  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    exclude-filter: '(?i)(到期时间|到期|剩余流量|剩余|流量|邀请码|邀请|官网|打不开网站|无法订阅|重新复制|订阅|套餐|重置|官方|Expire|Traffic|Invite|Official|Subscribe|Reset)'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 80
    timeout: 5000
    lazy: false

  - name: 🧪 测试节点
    type: url-test
    include-all: true
    exclude-filter: '(?i)(到期时间|到期|剩余流量|剩余|流量|邀请码|邀请|官网|打不开网站|无法订阅|重新复制|订阅|套餐|重置|官方|Expire|Traffic|Invite|Official|Subscribe|Reset)'
    url: https://cp.cloudflare.com/generate_204
    interval: 60
    tolerance: 0
    timeout: 5000
    lazy: false

  # ISP / 专线优选：只从名称明确标注 ISP、IEPL、IPLC、专线、家宽的节点中测速
  - name: ⚡ ISP优选
    type: url-test
    include-all: true
    filter: '(?i)(ISP|IEPL|IPLC|专线|家宽|原生|Dedicated|Residential)'
    exclude-filter: '(?i)(到期时间|到期|剩余流量|剩余|流量|邀请码|邀请|官网|打不开网站|无法订阅|重新复制|订阅|套餐|重置|官方|Expire|Traffic|Invite|Official|Subscribe|Reset)'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 60
    timeout: 5000
    lazy: true

  # ---------------- Regional Groups ----------------
  - name: 🇭🇰 香港节点
    type: url-test
    include-all: true
    filter: '(?i)(香港|港|HK|Hong ?Kong|HongKong)'
    exclude-filter: '(?i)(到期时间|到期|剩余流量|剩余|流量|邀请码|邀请|官网|打不开网站|无法订阅|重新复制|订阅|套餐|重置|官方|Expire|Traffic|Invite|Official|Subscribe|Reset)'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 60
    timeout: 5000
    lazy: true

  - name: 🇨🇳 台湾节点
    type: url-test
    include-all: true
    filter: '(?i)(台湾|台|TW|Taiwan|Taipei|台北)'
    exclude-filter: '(?i)(到期时间|到期|剩余流量|剩余|流量|邀请码|邀请|官网|打不开网站|无法订阅|重新复制|订阅|套餐|重置|官方|Expire|Traffic|Invite|Official|Subscribe|Reset)'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 60
    timeout: 5000
    lazy: true

  - name: 🇸🇬 狮城节点
    type: url-test
    include-all: true
    filter: '(?i)(新加坡|狮城|SG|Singapore)'
    exclude-filter: '(?i)(到期时间|到期|剩余流量|剩余|流量|邀请码|邀请|官网|打不开网站|无法订阅|重新复制|订阅|套餐|重置|官方|Expire|Traffic|Invite|Official|Subscribe|Reset)'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 60
    timeout: 5000
    lazy: true

  - name: 🇯🇵 日本节点
    type: url-test
    include-all: true
    filter: '(?i)(日本|东京|大阪|埼玉|川日|泉日|沪日|深日|JP|Japan|Tokyo|Osaka)'
    exclude-filter: '(?i)(到期时间|到期|剩余流量|剩余|流量|邀请码|邀请|官网|打不开网站|无法订阅|重新复制|订阅|套餐|重置|官方|Expire|Traffic|Invite|Official|Subscribe|Reset)'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 60
    timeout: 5000
    lazy: true

  - name: 🇺🇲 美国节点
    type: url-test
    include-all: true
    filter: '(?i)(美国|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|USA|United States|Los Angeles|Seattle)'
    exclude-filter: '(?i)(到期时间|到期|剩余流量|剩余|流量|邀请码|邀请|官网|打不开网站|无法订阅|重新复制|订阅|套餐|重置|官方|Expire|Traffic|Invite|Official|Subscribe|Reset)'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 60
    timeout: 5000
    lazy: true

  - name: 🇰🇷 韩国节点
    type: url-test
    include-all: true
    filter: '(?i)(韩国|首尔|韩|韓|KR|KOR|Korea|Seoul)'
    exclude-filter: '(?i)(到期时间|到期|剩余流量|剩余|流量|邀请码|邀请|官网|打不开网站|无法订阅|重新复制|订阅|套餐|重置|官方|Expire|Traffic|Invite|Official|Subscribe|Reset)'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 60
    timeout: 5000
    lazy: true

  - name: 🌍 其他地区
    type: url-test
    include-all: true
    filter: '(?i)(俄罗斯|加拿大|印度|印度尼西亚|土耳其|奥地利|希腊|德国|澳大利亚|爱尔兰|瑞典|瑞士|芬兰|英国|菲律宾|葡萄牙|西班牙|阿联酋|马来西亚|法国|泰国|俄罗斯|加拿大|Australia|Canada|Germany|France|UK|Spain|Sweden|Switzerland|Finland|Thailand|Malaysia|UAE|Austria|Greece|Ireland|Portugal|Philippines|Turkey|India|Indonesia|Russia)'
    exclude-filter: '(?i)(到期时间|到期|剩余流量|剩余|流量|邀请码|邀请|官网|打不开网站|无法订阅|重新复制|订阅|套餐|重置|官方|Expire|Traffic|Invite|Official|Subscribe|Reset)'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 80
    timeout: 5000
    lazy: true

  # ---------------- ISP Region Groups ----------------
  - name: 🇭🇰 香港ISP
    type: url-test
    include-all: true
    filter: '(?i)(香港\s*ISP|HK\s*ISP|Hong ?Kong.*ISP)'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 60
    timeout: 5000
    lazy: true

  - name: 🇰🇷 韩国ISP
    type: url-test
    include-all: true
    filter: '(?i)(韩国\s*ISP|KR\s*ISP|Korea.*ISP)'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 60
    timeout: 5000
    lazy: true

  - name: 🇨🇦 加拿大ISP
    type: url-test
    include-all: true
    filter: '(?i)(加拿大\s*ISP|Canada.*ISP)'
    url: https://cp.cloudflare.com/generate_204
