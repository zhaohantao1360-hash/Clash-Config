# =========================================================
# ZHT Mihomo Pro V4 / Clash Verge Rev
# 与 V3 内容一致，仅更换策略组图标为 lige47 图标集
# =========================================================
mode: rule
mixed-port: 7897
allow-lan: false
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - localhost
    - '*.localhost'
    - 'time.*.com'
    - 'time.*.gov'
    - 'ntp.*.com'
    - '+.push.apple.com'
    - '+.steamcontent.com'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    'geosite:private': system
    'geosite:cn':
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    '+.lan': system

geodata-mode: true
geox-url:
  geoip: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geo/geoip.dat
  geosite: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geo/geosite.dat
  mmdb: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geo/country-lite.mmdb

proxy-groups:
