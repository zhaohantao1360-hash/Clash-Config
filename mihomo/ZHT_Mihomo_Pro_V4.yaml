  - name: 🚀 手动切换
    type: select
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/05icon/zhuanyi.png
    include-all: true

  - name: ♻️ 自动选择
    type: url-test
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/05icon/chaxun.png
    include-all: true
    exclude-filter: '(?i)(到期时间|到期|剩余流量|剩余|流量|邀请码|邀请|官网|打不开网站|无法订阅|重新复制|订阅|套餐|重置|官方|Expire|Traffic|Invite|Official|Subscribe|Reset)'
