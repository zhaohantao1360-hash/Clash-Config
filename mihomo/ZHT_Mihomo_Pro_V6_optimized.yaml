# =========================================================
# ZHT Mihomo Pro V6 优化版（基于 2026-11-21 的 V4 脱敏公开版 / Clash Verge Rev）
# 更新日期：2026-11-21
# 特性：
#   - 纯规则与策略组模板，不含任何节点/订阅/密钥，可安全托管至公开 GitHub
#   - 全部规则源与图标统一走 fastly.jsdelivr.net 镜像（fmz200 图标库为主，lige47 补缺）
#   - 优化：自动选择 lazy 改 true、主选择器补香港ISP、ChinaZHT 换成 ChinaDomain+ChinaCompanyIp、
#     AppleIntelligence 换自托管 muse-TCS 版（含 PCC 域名，修 iOS 27 扩图漏分流）
#   - 顶层 hosts 加速 DoH 与 App Store；境外 DNS 走代理 IP-DoH 防污染
#   - AI 精细分流（Gemini/Claude/OpenAI/Apple AI）置于 Google 之前防截胡
# =========================================================
mode: rule
mixed-port: 7897
allow-lan: false
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
geodata-mode: true
global-client-fingerprint: chrome

profile:
  store-selected: true
  store-fake-ip: true

hosts:
  'doh.pub': 120.53.53.53
  'dns.alidns.com': [223.5.5.5, 223.6.6.6]
  'iosapps.itunes.apple.com': iosapps.itunes.apple.com.download.ks-cdn.com

dns:
  enable: true
  ipv6: false
  use-hosts: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.localdomain'
    - localhost
    - '*.localhost'
    - 'captive.apple.com'
    - 'time.*.com'
    - 'time.*.gov'
    - 'ntp.*.com'
    - '+.push.apple.com'
    - '+.steamcontent.com'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - '+.stun.*'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
    - 'lens.l.google.com'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    'geosite:private': system
    '+.lan': system
    'geosite:cn':
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    'geosite:geolocation-!cn':
      - 'https://1.1.1.1/dns-query#🚀 节点选择'
      - 'https://8.8.8.8/dns-query#🚀 节点选择'

sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - '+.push.apple.com'
    - 'Mijia Cloud'

tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - 'any:53'
    - 'tcp://any:53'

geox-url:
  geoip: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country-lite.mmdb

# --- 公共锚点 ---
x-url-test: &url-test
  type: url-test
  include-all: true
  exclude-filter: '(?i)(到期时间|到期|剩余流量|剩余|流量|邀请码|邀请|官网|打不开网站|无法订阅|重新复制|订阅|套餐|重置|官方|公告|Expire|Traffic|Invite|Official|Subscribe|Reset|Test)'
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 60
  timeout: 3000
  lazy: true

x-rule-provider: &rule-provider
  type: http
  behavior: classical
  format: text
  interval: 86400

# =========================================================
# 策略组（全 lige47 图标 + fastly.jsdelivr.net）
# =========================================================
proxy-groups:
