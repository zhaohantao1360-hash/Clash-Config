    type: select
    icon: https://fastly.jsdelivr.net/gh/fmz200/wool_scripts@main/icons/apps/rocket.png
    proxies:
      - ♻️ 自动选择
      - ⚡ ISP优选
      - 🇭🇰 香港节点
      - 🇭🇰 香港ISP
      - 🇹🇼 台湾节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🇰🇷 韩国节点
      - 🌍 其他地区
      - 🚀 手动切换
      - DIRECT

  - name: 🚀 手动切换
    type: select
    icon: https://fastly.jsdelivr.net/gh/fmz200/wool_scripts@main/icons/apps/select.png
    include-all: true

  - name: ♻️ 自动选择
    <<: *url-test
    icon: https://fastly.jsdelivr.net/gh/fmz200/wool_scripts@main/icons/apps/chaxun.png
    tolerance: 80
    lazy: true

  - name: ⚡ ISP优选
    <<: *url-test
    icon: https://fastly.jsdelivr.net/gh/fmz200/wool_scripts@main/icons/apps/lightning.png
    filter: '(?i)(ISP|IEPL|IPLC|专线|家宽|原生|Dedicated|Residential)'

  - name: 🇭🇰 香港节点
    <<: *url-test
    icon: https://fastly.jsdelivr.net/gh/fmz200/wool_scripts@main/icons/flag/HK_01.png
    filter: '(?i)(香港|港|HK|Hong ?Kong|HongKong)'

  - name: 🇭🇰 香港ISP
    <<: *url-test
    icon: https://fastly.jsdelivr.net/gh/fmz200/wool_scripts@main/icons/flag/HK_02.png
    filter: '(?i)(香港\s*ISP|HK\s*ISP|Hong ?Kong.*ISP)'

  - name: 🇹🇼 台湾节点
    <<: *url-test
