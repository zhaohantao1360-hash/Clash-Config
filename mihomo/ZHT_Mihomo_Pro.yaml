# =========================================================
# ZHT Mihomo Pro V2 / Clash Verge Rev
# =========================================================
# 设计目标：
# 1. 地区节点自动测速
# 2. 排除过期/流量/官网等非节点条目
# 3. OpenAI / Telegram / YouTube / Netflix 独立策略
# 4. 国内规则优先直连
# 5. China.list + ACL4SSR 规则协同
# 6. 阿里 DoH + 腾讯 DoH
# 7. 保留手动选择，方便故障排查
# =========================================================

mode: rule
mixed-port: 7897
allow-lan: false
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict

# ---------------- DNS ----------------
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - localhost
    - '*.localhost'
    - 'time.*.com'
    - 'time.*.gov'
    - 'ntp.*.com'
    - '+.push.apple.com'
    - '+.steamcontent.com'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    'geosite:private': system
    'geosite:cn':
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    '+.lan': system

# ---------------- GEO ----------------
geodata-mode: true
geox-url:
  geoip: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geo/geoip.dat
  geosite: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geo/geosite.dat
  mmdb: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country-lite.mmdb

# ---------------- Proxy Groups ----------------
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🧪 测试节点
      - 🇭🇰 香港节点
      - 🇨🇳 台湾节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🇰🇷 韩国节点
      - 🚀 手动切换
      - DIRECT

  - name: 🚀 手动切换
    type: select
    include-all: true

  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 80
    timeout: 5000
    lazy: false

  - name: 🧪 测试节点
    type: url-test
    include-all: true
    url: https://cp.cloudflare.com/generate_204
    interval: 60
    tolerance: 0
    timeout: 5000
    lazy: false

  # ---------- AI ----------
  - name: 💬 OpenAI
    type: select
    proxies:
      - 🇺🇲 美国节点
      - 🇯🇵 日本节点
      - 🇸🇬 狮城节点
      - ♻️ 自动选择
      - 🚀 节点选择
      - 🚀 手动切换
      - DIRECT

  # ---------- Telegram ----------
  - name: 📲 Telegram
    type: select
    proxies:
      - 🇸🇬 狮城节点
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🇨🇳 台湾节点
      - ♻️ 自动选择
      - 🚀 手动切换
      - DIRECT

  # ---------- YouTube ----------
  - name: 📹 YouTube
    type: select
    proxies:
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇨🇳 台湾节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🚀 手动切换
      - DIRECT

  # ---------- Netflix ----------
  - name: 🎥 Netflix
    type: select
    proxies:
      - 🎥 奈飞节点
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇨🇳 台湾节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🚀 手动切换
      - DIRECT

  - name: 🎥 奈飞节点
    type: select
    include-all: true
    filter: '(?i)(NF|奈飞|Netflix|解锁|流媒体|Media|Disney|HBO)'
    exclude-filter: '(?i)(过期|到期|剩余|流量|官网|套餐|重置|Expire|Traffic|Reset|Official)'

  # ---------- Regional Services ----------
  - name: 📺 巴哈姆特
    type: select
    proxies:
      - 🇨🇳 台湾节点
      - ♻️ 自动选择
      - 🚀 手动切换
      - DIRECT

  - name: 📺 哔哩哔哩
    type: select
    proxies:
      - DIRECT
      - 🇨🇳 台湾节点
      - 🇭🇰 香港节点
      - ♻️ 自动选择

  - name: 🌍 国外媒体
    type: select
    proxies:
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇨🇳 台湾节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🇰🇷 韩国节点
      - 🚀 手动切换
      - DIRECT

  - name: 🌏 国内媒体
    type: select
    proxies:
      - DIRECT
      - 🇭🇰 香港节点
      - 🇨🇳 台湾节点
      - ♻️ 自动选择
      - 🚀 手动切换

  # ---------- Microsoft / Apple ----------
  - name: Ⓜ️ Microsoft
    type: select
    proxies:
      - DIRECT
      - ♻️ 自动选择
      - 🇺🇲 美国节点
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🚀 手动切换

  - name: 🍎 Apple
    type: select
    proxies:
      - DIRECT
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇨🇳 台湾节点
      - 🇺🇲 美国节点
      - 🇯🇵 日本节点

  # ---------- Games / Music ----------
  - name: 🎮 游戏平台
    type: select
    proxies:
      - DIRECT
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇨🇳 台湾节点
      - 🇯🇵 日本节点
      - 🇸🇬 狮城节点
      - 🇺🇲 美国节点
      - 🚀 手动切换

  - name: 🎶 网易音乐
    type: select
    proxies:
      - DIRECT
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇨🇳 台湾节点

  # ---------- Utility ----------
  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 🍃 应用净化
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - ♻️ 自动选择
      - 🚀 手动切换

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
      - 🇭🇰 香港节点
      - 🇨🇳 台湾节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - 🇰🇷 韩国节点
      - 🚀 手动切换

  # ---------------- Region Auto Test ----------------
  - name: 🇭🇰 香港节点
    type: url-test
    include-all: true
    filter: '(?i)(港|香港|HK|Hong ?Kong|HongKong)'
    exclude-filter: '(?i)(过期|到期|剩余|流量|官网|套餐|重置|Expire|Traffic|Reset|Official)'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 60
    timeout: 5000
    lazy: true

  - name: 🇨🇳 台湾节点
    type: url-test
    include-all: true
    filter: '(?i)(台|台湾|新北|彰化|TW|Taiwan)'
    exclude-filter: '(?i)(过期|到期|剩余|流量|官网|套餐|重置|Expire|Traffic|Reset|Official)'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 60
    timeout: 5000
    lazy: true

  - name: 🇸🇬 狮城节点
    type: url-test
    include-all: true
    filter: '(?i)(新加坡|狮城|SG|Singapore)'
    exclude-filter: '(?i)(过期|到期|剩余|流量|官网|套餐|重置|Expire|Traffic|Reset|Official)'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 60
    timeout: 5000
    lazy: true

  - name: 🇯🇵 日本节点
    type: url-test
    include-all: true
    filter: '(?i)(日本|东京|大阪|埼玉|川日|泉日|沪日|深日|JP|Japan)'
    exclude-filter: '(?i)(过期|到期|剩余|流量|官网|套餐|重置|Expire|Traffic|Reset|Official)'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 60
    timeout: 5000
    lazy: true

  - name: 🇺🇲 美国节点
    type: url-test
    include-all: true
    filter: '(?i)(美|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)'
    exclude-filter: '(?i)(过期|到期|剩余|流量|官网|套餐|重置|Expire|Traffic|Reset|Official)'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 60
    timeout: 5000
    lazy: true

  - name: 🇰🇷 韩国节点
    type: url-test
    include-all: true
    filter: '(?i)(KR|Korea|KOR|韩国|首尔|韩|韓)'
    exclude-filter: '(?i)(过期|到期|剩余|流量|官网|套餐|重置|Expire|Traffic|Reset|Official)'
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 60
    timeout: 5000
    lazy: true

