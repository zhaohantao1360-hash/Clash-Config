# =========================================================
# ZHT Mihomo Pro V4 · Corn 机场专用版
# 基于 V4 优化版：只保留 Corn 实有的 美国/新加坡/香港/台湾/日本 五个地区
# 删除 ISP优选 / 韩国 / 其他地区 / 香港ISP；节点改由 proxy-providers「Corn」提供
# 使用前：把 proxy-providers.Corn.url 换成你的订阅链接
# Corn 的 Clash 订阅下发 17 个 Trojan 节点（台湾/香港/日本/新加坡各3，美国5）
# =========================================================
mode: rule
mixed-port: 7897
allow-lan: false
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost
  - '*.localhost'
  - time.*.com
  - time.*.gov
  - ntp.*.com
  - +.push.apple.com
  - +.steamcontent.com
  - +.msftconnecttest.com
  - +.msftncsi.com
  - +.stun.*
  - +.stun.*.*
  - +.stun.*.*.*
  - +.stun.*.*.*.*
  - lens.l.google.com
  hosts:
    doh.pub: 120.53.53.53
    dns.alidns.com:
    - 223.5.5.5
    - 223.6.6.6
    dns.pub:
    - 119.29.29.29
    - 1.12.12.12
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  - 180.76.76.76
  proxy-server-nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  - https://dns.pub/dns-query
  nameserver-policy:
    geosite:private: system
    geosite:cn:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    - https://dns.pub/dns-query
    geosite:gfw:
    - https://cloudflare-dns.com/dns-query#🚀 节点选择
    - https://dns.google/dns-query#🚀 节点选择
    +.lan: system
geodata-mode: true
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - +.push.apple.com
  - Mijia Cloud
geox-url:
  geoip: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geo/geoip.dat
  geosite: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geo/geosite.dat
  mmdb: https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geo/country-lite.mmdb
proxy-providers:
  Corn:
    type: http
    url: 这里替换成你的Corn机场Clash订阅链接
    path: ./proxy_providers/Corn.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
proxy-groups:
- name: 🚀 节点选择
  type: select
  icon: https://fastly.jsdelivr.net/gh/lige47/QuanX-icon-rule@main/icon/05icon/rocket.png
