name: Fix V3 AI icons final

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-icons:
    if: github.event.head_commit.message != 'fix: use stable icon CDN for Gemini Claude OpenAI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace icon URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mihomo/ZHT_Mihomo_Pro_V3.yaml')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Gemini.png', 'https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Google_Search.png')
          s = s.replace('https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Claude.png', 'https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/AI.png')
          s = s.replace('https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/OpenAI.png', 'https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ChatGPT.png')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mihomo/ZHT_Mihomo_Pro_V3.yaml
          git rm .github/workflows/fix-v3-icons-final.yml
          git commit -m 'fix: use stable icon CDN for Gemini Claude OpenAI'
          git push
